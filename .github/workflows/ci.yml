name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Least privilege: CI only needs to read the code. Third-party actions are pinned to a full
# commit hash so a moved tag can't change what runs.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-tests:
    name: Swift package tests (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Show toolchain
        run: swift --version
      - name: Test RHRCore
        run: ./scripts/test-linux.sh

  package-tests:
    name: Swift package tests (macOS)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Show toolchain
        run: xcodebuild -version && swift --version
      - name: Test RHRCore
        working-directory: Packages/RHRCore
        run: swift test

  ios-build:
    name: Build iOS app (simulator, unsigned)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build
        run: |
          set -o pipefail
          xcodebuild -project RHRMonitor.xcodeproj -scheme RHRMonitor \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug CODE_SIGNING_ALLOWED=NO build | tee build.log | grep -E "error:|warning:|BUILD" || true
          grep -q "BUILD SUCCEEDED" build.log
      - name: Build for device (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project RHRMonitor.xcodeproj -scheme RHRMonitor \
            -destination 'generic/platform=iOS' \
            -configuration Release CODE_SIGNING_ALLOWED=NO build | tail -5
