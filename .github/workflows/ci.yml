name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux-tests:
    name: Swift package tests (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: swift --version
      - name: Test RHRCore
        run: ./scripts/test-linux.sh

  package-tests:
    name: Swift package tests (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: xcodebuild -version && swift --version
      - name: Test RHRCore
        working-directory: Packages/RHRCore
        run: swift test

  ios-build:
    name: Build iOS app (simulator, unsigned)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          set -o pipefail
          xcodebuild -project RHRMonitor.xcodeproj -scheme RHRMonitor \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug CODE_SIGNING_ALLOWED=NO build | tee build.log | grep -E "error:|warning:|BUILD" || true
          grep -q "BUILD SUCCEEDED" build.log
      - name: Build for device (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project RHRMonitor.xcodeproj -scheme RHRMonitor \
            -destination 'generic/platform=iOS' \
            -configuration Release CODE_SIGNING_ALLOWED=NO build | tail -5
